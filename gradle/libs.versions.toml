[versions]
agp = "9.4.1"
material = "1.14.0"
appcompat = "1.7.1"
swiperefresh = "1.1.0"
drawerlayout = "1.2.0"
work = "2.10.1"
code-scanner = "16.1.0"
kotlin = "2.4.21"
ktlintPlugin = "14.2.0"
detekt = "1.23.8"
dokka = "2.2.0"
junit = "6.1.3"
jacoco = "0.8.15"
jsoup = "1.23.2"
serialization = "1.11.0"

[libraries]
material = { module = "com.google.android.material:material", version.ref = "material" }
play-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "code-scanner" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-work = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-swiperefresh = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefresh" }
androidx-drawerlayout = { module = "androidx.drawerlayout:drawerlayout", version.ref = "drawerlayout" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }

name: Release

# v から始まるタグ (例: v0.1.0) を push すると, APK (オリジナルのアイコン) をビルドして,
# GitHub Releases のドラフトに載せる (中身を確かめて, 手で公開する). 手動実行 (workflow_dispatch) は,
# タグを打たずにビルドして, APK を Actions の Artifacts に保存する.
# マークのアイコンの APK は権利が忽布古丹醸造にあるので, ここでは作らない (サブモジュールを取り込まない. .claude/CLAUDE.md).
# APK はデバッグ鍵で署名したデバッグ版 (リリース用の署名鍵は使っていない).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  apk:
    name: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Releases への書き込み

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Cache the Gradle home
        uses: ./.github/actions/gradle-cache

      - name: Build the APK
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm build

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/hop-kotan-*-debug.apk "hop-kotan_${{ github.ref_name }}.apk"

      - name: Create the draft release with the APK
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "hop-kotan_${{ github.ref_name }}.apk" \
            --draft --title "hop-kotan ${{ github.ref_name }}" --generate-notes

      - name: Upload the APK as an artifact
        uses: actions/upload-artifact@v6
        with:
          name: hop-kotan-apk
          path: hop-kotan_*.apk
          if-no-files-found: error

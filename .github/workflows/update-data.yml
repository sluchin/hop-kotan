name: Update the data

# サイトからデータを取得して, data/*.json を更新する.
#   taplist: 毎日 2 回 (タップルームの, 今日のタップリスト. 土日祝日は 12 時, 平日は 17 時から開くので, そのあとの 12:30 と 17:30)
#   beers  : 毎日 1 回 (17:30 の回. ORIGINALS と FREEDOMS の, 新しいビールを探す. 取得済みのビールは, 取り直さない)
# タップリスト (taplist.json) とビール (beers.json) は, 別のファイルに保存する.
# タップリストは, 日ごとの履歴 (taplist/<日付>.json) と, その目次 (taplist/index.json) にも保存する.
# 変わったときだけ, GitHub の Contents API でコミットする (scripts/publish-data.sh. Verified になる).
# サイトの作りが変わって, 1 件も読めなくなったら, 失敗する.

on:
  schedule:
    - cron: "30 3 * * *"   # 毎日 12:30 (JST). 土日祝日の開店のあとに取る
    - cron: "30 8 * * *"   # 毎日 17:30 (JST). 平日の開店のあとに取る
  workflow_dispatch:
    inputs:
      target:
        description: "更新するデータ"
        type: choice
        options: [ taplist, beers, both ]
        default: both

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decide what to update
        id: plan
        run: |
          target="${{ github.event.inputs.target }}"
          hour="$(date -u +%H)"
          if [ -z "$target" ] || [ "$target" = "both" ]; then
            echo "taplist=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "08" ]; then
              echo "beers=true" >> "$GITHUB_OUTPUT"
            else
              echo "beers=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "taplist=$([ "$target" = taplist ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "beers=$([ "$target" = beers ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Cache the Gradle home
        uses: ./.github/actions/gradle-cache

      - name: Get the tap list
        if: steps.plan.outputs.taplist == 'true'
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm scrape-taplist

      - name: Get the beers
        if: steps.plan.outputs.beers == 'true'
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm scrape-beers

      - name: Commit the changed files
        run: |
          if [ "${{ steps.plan.outputs.taplist }}" = "true" ]; then
            date="$(jq -r .date data/taplist.json)"
            MESSAGE="chore(data): Update the tap list of ${date}" \
              scripts/publish-data.sh data/taplist.json "data/taplist/${date}.json" data/taplist/index.json
          fi
          if [ "${{ steps.plan.outputs.beers }}" = "true" ]; then
            MESSAGE="chore(data): Update the beers" scripts/publish-data.sh data/beers.json
          fi

# 共通の設定. コンテナはホストのユーザーで実行する (生成物が root 所有にならないように).
# UID と GID はシェルでエクスポートしておく (SETUP.md)
x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
    target: dev
  image: hop-kotan-dev:latest
  volumes:
    - .:/workspace
    # Gradle のキャッシュ. 既定はボリューム gradle-cache. CI は GRADLE_HOME_DIR にキャッシュするディレクトリ
    # (絶対パス) を指定して, ボリュームの代わりに, そのディレクトリを使う (.github/actions/gradle-cache)
    - ${GRADLE_HOME_DIR:-gradle-cache}:/gradle-home
  working_dir: /workspace
  user: "${UID:-0}:${GID:-0}"
  environment:
    - HOME=/tmp
    # デバッグ用の署名の鍵 (debug.keystore) をボリュームに残す (残さないと, 署名が変わり, 上書きでインストールできない)
    - ANDROID_USER_HOME=/gradle-home/android

services:
  # 開発シェル
  dev:
    <<: *common
    stdin_open: true
    tty: true
    command: /bin/bash

  # 全てのモジュールをビルドする (APK は app/build/outputs/apk/debug/hop-kotan-<版>-debug.apk). Kotlin の警告が出たら失敗する
  # private/kotan-mark.svg (サブモジュール) があれば, アイコンをマークにする (その APK は配布しない).
  # なければ, オリジナルのアイコン (CI)
  build:
    <<: *common
    command: ./gradlew --no-daemon :core:assemble :scraper:assemble :app:assembleDebug

  # 単体テストを実行する
  test:
    <<: *common
    command: ./gradlew --no-daemon :core:test

  # core の行と分岐のカバレッジが 100% でなければ失敗する
  coverage:
    <<: *common
    command: ./gradlew --no-daemon :core:test :core:jacocoTestCoverageVerification

  # 整形の確認 (整形が必要なら失敗する)
  format:
    <<: *common
    command: ./gradlew --no-daemon --continue :core:ktlintCheck :scraper:ktlintCheck :app:ktlintCheck

  # 整形して, ファイルを書き換える (format が失敗したときに実行する)
  format-fix:
    <<: *common
    command: ./gradlew --no-daemon --continue :core:ktlintFormat :scraper:ktlintFormat :app:ktlintFormat

  # 静的解析 (detekt と Android Lint). 指摘があれば失敗する
  analyze:
    <<: *common
    command: ./gradlew --no-daemon --continue :core:detekt :scraper:detekt :app:detekt :app:lintDebug

  # ドキュメント (HTML) を生成する (core/build/dokka/html/index.html). 警告があれば失敗する
  docs:
    <<: *common
    command: ./gradlew --no-daemon :core:dokkaGenerate

  # タップルームのタップリストを取得して, data/taplist.json に書く (毎日)
  scrape-taplist:
    <<: *common
    command: ./gradlew --no-daemon -q :scraper:run --args="taplist data"

  # ORIGINALS と FREEDOMS のビールを取得して, data/beers.json に書く. 書いてあるものは, 取り直さない
  scrape-beers:
    <<: *common
    command: ./gradlew --no-daemon -q :scraper:run --args="beers data"

  # 生成物 (build/ と .gradle/ と .kotlin/) を消す. Gradle のキャッシュ (ボリューム) は消さない
  clean:
    <<: *common
    command: sh -c "rm -rf build core/build scraper/build app/build .gradle .kotlin && echo 'Removed the build outputs'"

volumes:
  gradle-cache:
